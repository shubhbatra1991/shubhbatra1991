<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 438" width="600" height="438" role="img" aria-labelledby="title desc">
  <title id="title">Saurabh Batra — Frontend-Led Full Stack Engineer</title>
  <desc id="desc">Building AI-powered products, engineering interactive experiences, and turning ideas into software.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1722"/><stop offset="1" stop-color="#091017"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#4f8ac9" stop-opacity=".25"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#134e4a" stop-opacity=".3"/><stop offset="1" stop-color="#134e4a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7cb0ba" stroke-opacity=".035"/></pattern>
  </defs>
  
    <style>
      .r0 { animation: first 20s 2; }
      .r1 { opacity: 0; animation: second 20s 2; }
      .r2 { opacity: 0; animation: third 20s 2; }
      .r3 { opacity: 0; animation: fourth 20s 2; }
      @keyframes first { 0%,22% {opacity:1} 25%,97% {opacity:0} 100% {opacity:1} }
      @keyframes second { 0%,24% {opacity:0} 27%,47% {opacity:1} 50%,100% {opacity:0} }
      @keyframes third { 0%,49% {opacity:0} 52%,72% {opacity:1} 75%,100% {opacity:0} }
      @keyframes fourth { 0%,74% {opacity:0} 77%,94% {opacity:1} 97%,100% {opacity:0} }
      @media (prefers-reduced-motion: reduce) {
        .r0 { animation:none; opacity:1 }
        .r1,.r2,.r3 { animation:none; opacity:0 }
      }
    </style>
  <rect x="1" y="1" width="598" height="436" rx="18" fill="url(#bg)" stroke="#28404d"/>
  <rect x="2" y="2" width="596" height="434" rx="17" fill="url(#grid)"/>
  <ellipse cx="440" cy="190" rx="290" ry="205" fill="url(#glow)"/>
  <path d="M22 49 H578" stroke="#21313e"/>
  <g fill="#4b6371"><circle cx="34" cy="26" r="4"/><circle cx="50" cy="26" r="4"/><circle cx="66" cy="26" r="4"/></g>
  <text x="96" y="30" fill="#93adba" font-family="Consolas, monospace" font-size="11" letter-spacing="1">saurabh@github ~ / portfolio</text>
  <text x="34" y="100" fill="#5eead4" font-family="Consolas, monospace" font-size="13" letter-spacing="3">ENGINEERING / INTERFACES / EXPERIENCES</text>
  <text x="31" y="158" fill="#eff8fb" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="700" letter-spacing="-2">SAURABH BATRA</text>
  <g fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500"><text class="r0" x="34" y="210" opacity="1">Frontend-Led Full Stack Engineer</text><text class="r1" x="34" y="210" opacity="0">Building AI-Powered Products</text><text class="r2" x="34" y="210" opacity="0">Engineering Interactive Experiences</text><text class="r3" x="34" y="210" opacity="0">Turning Ideas Into Software</text></g>
  <text x="34" y="260" fill="#9ab1bf" font-family="Consolas, monospace" font-size="16">Frontend craft. Full-stack thinking.</text>
  
  <path d="M34 320 H566" stroke="url(#edge)"/>
  <text x="34" y="354" fill="#70909e" font-family="Consolas, monospace" font-size="12">$</text>
  <text x="54" y="354" fill="#c4d6df" font-family="Consolas, monospace" font-size="15">build thoughtful software</text>
  <rect x="274" y="341" width="7" height="16" fill="#5eead4" opacity=".7"/>
  <text x="34" y="386" fill="#8aa5b4" font-family="Consolas, monospace" font-size="13" letter-spacing="1">REACT · TYPESCRIPT · FULL STACK · AI · UNITY</text>
</svg>
