
name: Generate Commit Defender

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile generator
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate from unauthenticated public calendar
        run: |
          python3 scripts/test-commit-defender.py
          python3 scripts/generate-commit-defender.py --output dist

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
